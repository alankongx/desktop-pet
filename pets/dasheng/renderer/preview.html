<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>大圣喵桌宠预览 — 白底/暗底双舞台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f0f0f0;
      min-height: 100vh;
      padding: 50px 20px 40px;
      font-family: -apple-system, sans-serif;
    }
    h2 {
      text-align: center;
      color: #333;
      margin: 0 0 24px;
      font-size: 16px;
      font-weight: 600;
    }
    h2 small {
      display: block;
      color: #888;
      font-size: 12px;
      font-weight: 400;
      margin-top: 4px;
    }
    .row {
      display: flex;
      gap: 32px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }
    .frame {
      position: relative;
      border-radius: 14px;
      overflow: hidden;          /* 防止 iframe 内部东西溢出影响 frame */
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }
    /* 暗色舞台：模拟 macOS 桌面深色 */
    .frame.dark {
      width: 260px;
      height: 220px;
      background: linear-gradient(135deg, #2a2a3e 0%, #1a1a28 100%);
      border: 1px solid rgba(255,255,255,0.06);
    }
    /* 白色舞台：模拟 WorkBuddy 客户端白底 */
    .frame.white {
      width: 260px;
      height: 220px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
    }
    /* 顶栏：模拟 macOS/Chrome 按钮区，验证不挡 */
    .titlebar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }
    .titlebar.dark { background: rgba(255,255,255,0.04); }
    .titlebar.white { background: #fafafa; border-bottom: 1px solid #eee; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      display: inline-block;
    }
    .dot.r { background: #ff5f57; }
    .dot.y { background: #ffbd2e; }
    .dot.g { background: #28c840; }
    .label {
      position: absolute;
      bottom: -22px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
    }
    .frame.dark .label { color: rgba(0,0,0,0.6); }
    .frame.white .label { color: #555; }

    /* 桌宠舞台：112×146 真窗口大小（128 桌宠 + 18 气泡位） */
    .stage-host {
      position: absolute;
      width: 112px;
      height: 146px;
      right: 14px;     /* 放右侧贴边，模拟老板把宠物放屏幕最右 */
      bottom: 10px;
      overflow: hidden;
    }
    iframe {
      border: none;
      background: transparent;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <h2>
    大圣喵桌宠 · 双背景对照预览
    <small>左：暗色桌面（如 macOS 暗色壁纸） · 右：白底（如 WorkBuddy 客户端白色聊天界面）</small>
  </h2>

  <div class="row">
    <!-- 暗色舞台 -->
    <div class="frame dark">
      <div class="titlebar dark">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="stage-host">
        <iframe src="index.html?v=5"></iframe>
      </div>
      <div class="label">🌙 暗色桌面</div>
    </div>

    <!-- 白色舞台 -->
    <div class="frame white">
      <div class="titlebar white">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      </div>
      <div class="stage-host">
        <iframe src="index.html?v=5"></iframe>
      </div>
      <div class="label">☀️ 白底 APP</div>
    </div>
  </div>

  <p style="text-align:center;color:#888;font-size:12px;margin-top:8px;">
    1/2 尺寸 = 112×128 桌宠 · 气泡 18px 在头顶 · 总窗口 112×146
  </p>
</body>
</html>
